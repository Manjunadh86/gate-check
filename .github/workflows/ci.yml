name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Both of these run with no credentials and no Sanity account, which is the
      # point: the correctness claims in the README are checkable by anyone.
      - name: Resolver unit tests
        run: npm test
      - name: Known-answer evaluations
        run: npm run eval
      - name: Build the app
        run: npm run build
